[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F7F9FA"
secondaryBackgroundColor = "#ECF2F1"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#D5DEDC"
baseRadius = "0.65rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
chartCategoricalColors = ["#94A3B8", "#F59E0B", "#0EA5E9", "#0F766E"]

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
borderColor = "#334155"
